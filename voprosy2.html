<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1D36">
<title>ZELDO · вопросы 13.11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<!-- Вопросник № 2 (13.11.2026): открытые вопросы из задачи #33 и новые после встречи 12.11. Устроен как первый.
     Вопросник для Максима (10.11.2026, его голосовые 16:29–19:10): «по одному вопросу, варианты ответа и рекомендация с объяснением;
     отвечаешь 1, 2, 3 или своим вариантом; потом из всех ответов формируется документ». Без аккаунтов: ответы хранятся на телефоне
     (localStorage), в конце уходят Матвею в Телеграм одной кнопкой или копируются. Вопросы — разбор Кворка 07.11 и открытые решения дорожной карты -->
<style>
:root { --bg: #EEF2F8; --card: #FFFFFF; --ink: #0E1D36; --muted: #5B6B84; --line: #DCE3EE; --soft: #E8F0FE; --act: #0B6CF2; --act-ink: #FFFFFF; --rec: #17733F; --rec-soft: #E7F5EC; --hdr: #0E1D36; }
@media (prefers-color-scheme: dark) { :root { --bg: #0B1424; --card: #13203A; --ink: #EEF3FB; --muted: #9AA9C0; --line: #24345A; --soft: #172B4D; --act: #3D8EF8; --rec: #5BD08A; --rec-soft: #12301F; --hdr: #070D18; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Onest", "Segoe UI", system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
button, textarea { font: inherit; color: inherit; }
.top { background: var(--hdr); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 16px 14px; }
.top .in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.logo { font-weight: 800; letter-spacing: 0.04em; font-size: 20px; }
.prog { flex: 1; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
.prog i { display: block; height: 100%; background: #3D8EF8; border-radius: 3px; transition: width 0.25s ease; }
.cnt { font-size: 14px; color: #C7D2E4; font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
main { max-width: 640px; margin: 0 auto; padding: 20px 16px calc(120px + env(safe-area-inset-bottom)); }
.blk { font-size: 14px; font-weight: 600; color: var(--act); text-transform: uppercase; letter-spacing: 0.06em; margin: 4px 0 8px; }
h1 { font-size: 26px; line-height: 32px; margin: 0 0 10px; font-weight: 700; }
.ctx { color: var(--muted); font-size: 16px; line-height: 24px; margin: 0 0 18px; }
.rec { background: var(--rec-soft); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; font-size: 15px; line-height: 22px; }
.rec b { color: var(--rec); }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; padding: 14px 16px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; transition: border-color 0.15s ease, background-color 0.15s ease; }
.opt .n { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--act); font-weight: 700; font-size: 15px; }
.opt .t { display: grid; gap: 4px; font-size: 17px; line-height: 23px; }
.opt .s { color: var(--muted); font-size: 14px; line-height: 20px; }
.opt .badge { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--rec-soft); color: var(--rec); font-size: 12px; font-weight: 600; vertical-align: 2px; }
.opt.on { border-color: var(--act); background: var(--soft); }
.opt.on .n { background: var(--act); color: var(--act-ink); }
@media (hover: hover) { .opt:hover { border-color: var(--act); } }
label.cm { display: block; margin-top: 16px; font-size: 15px; color: var(--muted); }
textarea { width: 100%; min-height: 84px; margin-top: 6px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); font-size: 16px; line-height: 22px; resize: vertical; }
textarea:focus { outline: none; border-color: var(--act); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); box-shadow: 0 -1px 0 var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
.bar .in { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; }
.btn { flex: 1; min-height: 52px; border-radius: 14px; border: 0; background: var(--act); color: var(--act-ink); font-size: 17px; font-weight: 600; cursor: pointer; }
.btn.soft { flex: 0 0 auto; padding: 0 18px; background: var(--soft); color: var(--act); }
.btn:disabled { opacity: 0.45; cursor: default; }
.hello p, .end p { font-size: 17px; line-height: 26px; }
.hello ol { padding-left: 22px; font-size: 16px; line-height: 26px; color: var(--muted); }
.sum { display: grid; gap: 10px; margin: 16px 0; }
.sum div { background: var(--card); border-radius: 14px; padding: 12px 14px; font-size: 15px; line-height: 21px; }
.sum b { display: block; margin-bottom: 4px; }
.sum .m { color: var(--muted); }
.sum button { all: unset; color: var(--act); font-size: 14px; cursor: pointer; margin-top: 6px; display: inline-block; }
.ok { color: var(--rec); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .prog i, .opt { transition: none; } }
</style>
</head>
<body>
<div class="top"><div class="in"><span class="logo">ZELDO</span><span class="prog" aria-hidden="true"><i id="pg" style="width:0"></i></span><span class="cnt" id="cnt"></span></div></div>
<main id="app"></main>
<div class="bar"><div class="in" id="bar"></div></div>
<script>
/* вопросы: блок, вопрос, пояснение, варианты [текст, подпись], номер рекомендованного (с 1), почему рекомендую */
const Q = [
  ['Сроки', 'Долгие работы: сколько времени у заказчика, чтобы принять работу?', 'Ремонт, пошив штор, уборка без хозяев. Сейчас офлайн-работу принимают за час, а заказчик может не успеть даже приехать.',
    [['Срок зависит от услуги', 'Стрижка, маникюр — 1 час. Работа без заказчика — 3 дня, исполнитель прикладывает фото. Большой ремонт — по этапам'], ['Всем офлайн-работам — 24 часа', 'Проще, но мастер маникюра ждёт деньги сутки'], ['Всем — 3 дня', 'Заказчику спокойно, мастерам долго']], 1,
    'Быстрые услуги закрываются за час, как вы решили. Долгим работам нужен свой срок. Этапы защищают обе стороны в большом ремонте: заказчик платит за то, что видел, а мастер не ждёт денег месяц.'],
  ['Запуск', 'Облако для сервера: какое и на кого заводим аккаунт?', 'В прошлый раз вы выбрали Яндекс и приписали «другой вариант». Сейчас сервер работает на компьютере Матвея: ссылка временная, без его Mac приложение не открыть.',
    [['Яндекс Облако на ООО', 'Договор и счета на компанию, данные в России'], ['Яндекс Облако на Матвея', 'Быстрее завести, потом переоформлять'], ['Другое облако', 'Напишите какое в комментарии']], 1,
    'Данные россиян по закону храним в России, а оператор данных у нас ООО. Значит, и облако сразу на ООО, чтобы потом не переоформлять.'],
  ['Деньги', 'Комиссия ступенями: что между 10 % и 5 %?', 'Решено: 10 % обычная ставка, 7 % с постоянных клиентов мастера, 5 % с заказа дороже 500 000 ₽. Не решено, что посередине и как считать ступень.',
    [['10 % до 100 000 ₽, 7 % до 500 000 ₽, 5 % дороже', 'Считаем по одному заказу, ставка видна сразу под ценой'], ['Ступень по обороту мастера за месяц', 'Выгодно активным, но ставка меняется посреди месяца'], ['Только 10 % и 5 %, без середины', 'Проще всего']], 1,
    'Ставку по одному заказу мастер видит сразу в строке «Вы получите» и не гадает, во что выйдет месяц. Оборот за месяц сложнее и объяснить, и посчитать.'],
  ['Деньги', 'Выплата сразу: оставляем минимум 200 ₽?', 'Сейчас: сразу — за 3 %, но не меньше 200 ₽. Тогда мастер с выплатой 1 000 ₽ отдаёт 200 ₽, то есть 20 %.',
    [['3 % без минимума', 'С 1 000 ₽ — 30 ₽'], ['3 %, но не меньше 50 ₽', 'С 1 000 ₽ — 50 ₽'], ['3 %, но не меньше 200 ₽', 'Как сейчас']], 2,
    'Минимум нужен: банк берёт за перевод и с маленькой суммы. Но 200 ₽ отпугнут мастеров с недорогими заказами, а 50 ₽ с тысячи выглядят честно.'],
  ['Деньги', 'Вы написали «плюс баллы» к способам оплаты. Что имели в виду?', 'В вопросе «Как заказчик платит?» вы добавили баллы. Хотим понять, нужны ли они к запуску и в каком виде.',
    [['Бонусы за заказы: ими платят часть следующего заказа', 'Как кешбэк в магазинах'], ['Баллы банка или «Спасибо» от Сбера', 'Оплата чужими бонусами через платёжный сервис'], ['Не к запуску, обсудим потом', '']], 3,
    'К запуску хватит карты, СБП и рассрочки. Баллы — отдельная программа лояльности, её лучше делать, когда появятся постоянные заказчики.'],
  ['Отмены', 'Отмена после первого часа: как быть с законом?', 'Сейчас заказчик бесплатно отменяет в первый час после оплаты, позже — по договорённости или через спор. Но по закону о защите прав потребителей (ст. 32) заказчик может отказаться в любой момент, оплатив исполнителю фактические расходы.',
    [['Отменить можно всегда, исполнитель получает компенсацию', 'Больше суток до визита — полный возврат. Меньше — исполнителю плата за выезд или 30 %'], ['Оставляем как есть, показываем юристу', ''], ['Обсудим на встрече', '']], 1,
    'Так правило не спорит с законом, и мастер не остаётся ни с чем. Юристу всё равно покажем перед запуском.'],
  ['Деньги', 'Возврат при отмене: на баланс ZELDO или на карту?', 'На встрече 12.11 решили: возврат приходит на баланс, вывести на карту можно с комиссией 2 %. Но деньги за неоказанную услугу заказчик по закону вправе получить обратно полностью.',
    [['На баланс, а вывести возврат на карту можно бесплатно', '2 % — только за вывод пополнений'], ['Сразу на карту', 'Баланс — только для пополнений'], ['На баланс, вывод с 2 %', 'Как сейчас']], 1,
    'Многие оставят деньги на балансе и закажут снова. Кто хочет вернуть их на карту, получит всё без удержаний, и с законом мы не спорим.'],
  ['Название', 'ZELFIR: когда переименовываем?', 'Название решили сменить. Переименовать приложение, сайт и тексты — примерно день работы.',
    [['Сейчас, до прогона вдвоём', 'На прогоне уже видим новое имя'], ['Перед запуском', 'Пока работаем под ZELDO'], ['Сразу после запуска', '']], 1,
    'Чем больше людей увидят ZELDO, тем дороже смена: ссылки, скриншоты, привычка. Пока приложение видим только мы двое, переименование ничего не ломает.'],
  ['Название', 'Логотип ZELFIR: какой нужен сейчас?', 'В приложении сейчас вместо знака — само название.',
    [['Пока просто слово ZELFIR', 'Знак закажем перед запуском'], ['Матвей делает 3 варианта знака на выбор', 'За пару дней'], ['Сразу заказываем знак у дизайнера', 'Несколько недель и бюджет']], 1,
    'Для прогона и первых мастеров хватит названия. Знак лучше заказывать, когда станет ясен стиль рекламы и соцсетей.'],
  ['Доверие', 'Значок «Проверен»: как проверяем паспорт и статус?', 'Автопроверка паспорта — платный сервис с договором. Статус самозанятого или ИП налоговая отдаёт бесплатно.',
    [['Паспорт вручную, статус в ФНС — автоматически', 'Сотрудник смотрит фото паспорта в админке'], ['Всё вручную', 'Как сейчас'], ['Сразу подключаем платный сервис', 'Быстрее для мастера, но договор и оплата за каждую проверку']], 1,
    'На старте мастеров десятки, их паспорта можно проверить руками. Проверку статуса в налоговой сделаю сразу, она бесплатная. Платный сервис — когда заявок станет много.'],
];const KEY = 'zeldo-voprosy-2b';
let st; try { st = JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { st = null; }
if (!st) st = { i: -1, a: {} };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* без памяти — ответы держатся до закрытия */ } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const $ = id => document.getElementById(id);
function head() { const n = Q.length; const i = Math.max(0, Math.min(st.i, n));
  $('pg').style.width = `${st.i < 0 ? 0 : Math.round(i / n * 100)}%`; $('cnt').textContent = st.i < 0 ? '' : st.i >= n ? 'готово' : `${st.i + 1} из ${n}`; }
function answerText(k) { const q = Q[k], a = st.a[k] || {}; const pick = a.o ? `${a.o}. ${q[3][a.o - 1][0]}` : 'свой вариант'; return `${pick}${a.c ? ` — ${a.c}` : ''}`; }
function show() {
  head(); window.scrollTo(0, 0);
  if (st.i < 0) {
    $('app').innerHTML = `<section class="hello"><div class="blk">Вопросы для решений</div><h1>${Q.length} вопросов после встречи 12.11</h1>
      <p>По одному вопросу на экране. У каждого — варианты ответа и рекомендация Матвея с объяснением.</p>
      <ol><li>Выберите вариант или напишите свой.</li><li>Комментарий — по желанию.</li><li>В конце нажмите «Отправить» и выберите Телеграм или почту Матвея: сами ответы не уходят.</li></ol>
      <p class="ctx">Можно прерваться: ответы запоминаются на этом телефоне. Займёт около ${Math.ceil(Q.length / 3)} минут.</p></section>`;
    $('bar').innerHTML = `<button class="btn" id="go">${Object.keys(st.a).length ? 'Продолжить' : 'Начать'}</button>`;
    $('go').onclick = () => { st.i = Object.keys(st.a).length ? Math.min(Q.length, Object.keys(st.a).length) : 0; save(); show(); };
    return;
  }
  if (st.i >= Q.length) return end();
  const k = st.i, q = Q[k], a = st.a[k] || {};
  $('app').innerHTML = `<div class="blk">${esc(q[0])}</div><h1>${esc(q[1])}</h1><p class="ctx">${esc(q[2])}</p>
    <div class="rec"><b>Рекомендую ${q[4]}.</b> ${esc(q[5])}</div>
    <div class="opts" role="radiogroup" aria-label="Варианты ответа">${q[3].map((o, j) => `<button class="opt ${a.o === j + 1 ? 'on' : ''}" role="radio" aria-checked="${a.o === j + 1}" data-o="${j + 1}"><span class="n">${j + 1}</span><span class="t"><span>${esc(o[0])}${j + 1 === q[4] ? '<span class="badge">рекомендую</span>' : ''}</span>${o[1] ? `<span class="s">${esc(o[1])}</span>` : ''}</span></button>`).join('')}</div>
    <label class="cm" for="cm">Свой вариант или комментарий</label><textarea id="cm" placeholder="Например: да, но с оговоркой…">${esc(a.c || '')}</textarea>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => { st.a[k] = Object.assign({}, st.a[k], { o: +b.dataset.o }); save(); show(); });
  $('cm').oninput = e => { st.a[k] = Object.assign({}, st.a[k], { c: e.target.value.trim() }); if (!st.a[k].o && !st.a[k].c) delete st.a[k]; save(); $('nx').disabled = !st.a[k]; };
  $('bar').innerHTML = `<button class="btn soft" id="bk">Назад</button><button class="btn" id="nx" ${st.a[k] ? '' : 'disabled'}>${k === Q.length - 1 ? 'Готово' : 'Дальше'}</button>`;
  $('bk').onclick = () => { st.i--; save(); show(); };
  $('nx').onclick = () => { st.i++; save(); show(); };
}
/* сообщение в Телеграме — до 4096 знаков: вопрос сокращаем до начала; не влезло — только номера ответов и комментарии (полный текст Матвей восстановит по номерам) */
function report(full) {
  const h = `Ответы Максима, вопросник № 2 по ZELDO (${new Date().toLocaleDateString('ru-RU')})\n\n`;
  const cut = s => s.length > 48 ? s.slice(0, 46).replace(/\s+\S*$/, '') + '…' : s;
  const a = h + Q.map((q, k) => `${k + 1}. ${full ? q[1] : cut(q[1])}\n→ ${st.a[k] ? answerText(k) : 'без ответа'}`).join(full ? '\n\n' : '\n');
  if (full || a.length <= 3900) return a;
  return h + Q.map((q, k) => { const x = st.a[k] || {}; return `${k + 1} → ${x.o || '—'}${x.c ? ` («${x.c}»)` : ''}`; }).join('\n');
}
function end() {
  const missed = Q.filter((q, k) => !st.a[k]).length;
  $('app').innerHTML = `<section class="end"><div class="blk">Готово</div><h1>Спасибо! Осталось отправить ответы Матвею</h1>
    <p><b>Сами ответы никуда не уходят.</b> Нажмите «Отправить» внизу и выберите Телеграм (чат с Матвеем) или почту.</p>
    <p>${missed ? `Без ответа: ${missed}. Можно вернуться к ним или отправить так.` : 'Ответы есть на все вопросы.'} По ним Матвей соберёт итоговый документ.</p>
    <div class="sum">${Q.map((q, k) => `<div><b>${k + 1}. ${esc(q[1])}</b><span class="${st.a[k] ? '' : 'm'}">${st.a[k] ? esc(answerText(k)) : 'без ответа'}</span><br><button data-k="${k}">Изменить</button></div>`).join('')}</div>
    <p class="ctx" id="msg"></p></section>`;
  document.querySelectorAll('.sum button').forEach(b => b.onclick = () => { st.i = +b.dataset.k; save(); show(); });
  $('bar').innerHTML = `<button class="btn soft" id="cp">Скопировать</button><button class="btn" id="tg">Отправить</button>`;
  /* 11.11.2026: Максим нажал «Я ответил», а сообщение не дошло — длинная ссылка t.me на телефоне теряет текст.
     Теперь сначала системное «Поделиться» с полным текстом (iPhone, Android), ссылка на Телеграм — только запасной путь. */
  $('tg').onclick = async () => {
    if (navigator.share) {
      try { await navigator.share({ text: report() }); $('msg').innerHTML = '<span class="ok">Готово.</span> Если выбрали Матвея и нажали «Отправить», ответы у него.'; return; }
      catch (e) { if (e && e.name === 'AbortError') { $('msg').textContent = 'Отправка отменена. Нажмите ещё раз и выберите Телеграм → чат с Матвеем.'; return; } }
    }
    const t = report(); window.open(`https://t.me/share/url?url=${encodeURIComponent(location.origin + location.pathname)}&text=${encodeURIComponent('\n' + t)}`, '_blank'); $('msg').textContent = 'Выберите в Телеграме чат с Матвеем и отправьте.'; };
  $('cp').onclick = async () => { try { await navigator.clipboard.writeText(report(true)); $('msg').innerHTML = '<span class="ok">Скопировано.</span> Вставьте в чат с Матвеем.'; } catch (e) { $('msg').textContent = 'Не получилось скопировать. Нажмите «Отправить».'; } };
}
show();
</script>
</body>
</html>
