<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1D36">
<title>ZELDO · вопросы 22.11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<!-- Вопросник № 3 (22.11.2026): всё, что ждёт ответа Максима перед встречей — партнёрка и награды, вопросник № 2 без ответа, админка, споры.
     Устроен как первые два: по одному вопросу, варианты и рекомендация Матвея. Без аккаунтов: ответы хранятся на телефоне
     (localStorage), в конце уходят Матвею в Телеграм одной кнопкой или копируются — как в вопроснике № 2. -->
<style>
/* Лента вопросов: тёмная шапка с прогрессом, один вопрос на экране, кнопки внизу — как вопросники № 1 и № 2 */
:root { --bg: #EEF2F8; --card: #FFFFFF; --ink: #0E1D36; --muted: #5B6B84; --line: #DCE3EE; --soft: #E8F0FE; --act: #0B6CF2; --act-ink: #FFFFFF; --rec: #17733F; --rec-soft: #E7F5EC; --hdr: #0E1D36; --hdr-ink: #FFFFFF; --hdr-muted: #C7D2E4;
  --f-body: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0B1424; --card: #13203A; --ink: #EEF3FB; --muted: #9AA9C0; --line: #24345A; --soft: #172B4D; --act: #3D8EF8; --act-ink: #FFFFFF; --rec: #5BD08A; --rec-soft: #12301F; --hdr: #070D18; --hdr-ink: #FFFFFF; --hdr-muted: #9AA9C0; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0B1424; --card: #13203A; --ink: #EEF3FB; --muted: #9AA9C0; --line: #24345A; --soft: #172B4D; --act: #3D8EF8; --act-ink: #FFFFFF; --rec: #5BD08A; --rec-soft: #12301F; --hdr: #070D18; --hdr-ink: #FFFFFF; --hdr-muted: #9AA9C0; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--hdr); }
button, textarea { font: inherit; color: inherit; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--hdr); color: var(--hdr-ink); padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top .in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.logo { font-weight: 800; letter-spacing: 0.04em; font-size: 20px; }
.prog { flex: 1; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
.prog i { display: block; height: 100%; background: #3D8EF8; border-radius: 3px; transition: width 0.25s ease; }
.cnt { font-size: 14px; color: var(--hdr-muted); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
main { max-width: 640px; margin: 0 auto; padding-block: 20px calc(120px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.blk { font-size: 14px; font-weight: 600; color: var(--act); text-transform: uppercase; letter-spacing: 0.06em; margin: 4px 0 8px; }
h1 { font-size: 26px; line-height: 32px; margin: 0 0 10px; font-weight: 700; text-wrap: balance; }
.ctx { color: var(--muted); font-size: 16px; line-height: 24px; margin: 0 0 18px; }
.rec { background: var(--rec-soft); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; font-size: 15px; line-height: 22px; }
.rec b { color: var(--rec); }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; padding: 14px 16px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; transition: border-color 0.15s ease, background-color 0.15s ease; }
.opt .n { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--act); font-weight: 700; font-size: 15px; }
.opt .t { display: grid; gap: 4px; font-size: 17px; line-height: 23px; min-width: 0; }
.opt .s { color: var(--muted); font-size: 14px; line-height: 20px; }
.opt .badge { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--rec-soft); color: var(--rec); font-size: 12px; font-weight: 600; vertical-align: 2px; }
.opt.on { border-color: var(--act); background: var(--soft); }
.opt.on .n { background: var(--act); color: var(--act-ink); }
.opt:focus-visible, .btn:focus-visible, textarea:focus-visible { outline: 2px solid var(--act); outline-offset: 2px; }
@media (hover: hover) { .opt:hover { border-color: var(--act); } }
label.cm { display: block; margin-top: 16px; font-size: 15px; color: var(--muted); }
textarea { width: 100%; min-height: 84px; margin-top: 6px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); font-size: 16px; line-height: 22px; resize: vertical; }
textarea:focus { outline: none; border-color: var(--act); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); box-shadow: 0 -1px 0 var(--line); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar .in { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; }
.btn { flex: 1; min-height: 52px; border-radius: 14px; border: 0; background: var(--act); color: var(--act-ink); font-size: 17px; font-weight: 600; cursor: pointer; }
.btn.soft { flex: 0 0 auto; padding: 0 18px; background: var(--soft); color: var(--act); }
.btn:disabled { opacity: 0.45; cursor: default; }
.hello p, .end p { font-size: 17px; line-height: 26px; }
.hello ol { padding-left: 22px; font-size: 16px; line-height: 26px; color: var(--muted); }
.groups { display: grid; gap: 8px; margin: 14px 0; }
.groups div { background: var(--card); border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
.groups b { font-variant-numeric: tabular-nums; color: var(--act); }
.sum { display: grid; gap: 10px; margin: 16px 0; }
.sum div { background: var(--card); border-radius: 14px; padding: 12px 14px; font-size: 15px; line-height: 21px; }
.sum b { display: block; margin-bottom: 4px; }
.sum .m { color: var(--muted); }
.sum button { all: unset; color: var(--act); font-size: 14px; cursor: pointer; margin-top: 6px; display: inline-block; }
.ok { color: var(--rec); font-weight: 600; }
.saved { font-size: 14px; color: var(--muted); margin-top: 14px; min-height: 20px; }
@media (prefers-reduced-motion: reduce) { .prog i, .opt { transition: none; } }
</style>
</head>
<body>
<div class="top"><div class="in"><span class="logo">ZELDO</span><span class="prog" aria-hidden="true"><i id="pg" style="width:0"></i></span><span class="cnt" id="cnt"></span></div></div>
<main id="app"></main>
<div class="bar"><div class="in" id="bar"></div></div>
<script>
/* вопросы: блок, вопрос, пояснение, варианты [текст, подпись], номер рекомендованного (с 1), почему рекомендую */
const Q = [
  ['Награды', 'Ступени исполнителя: когда он «Стабильный», «Надёжный», «Выбор ZELDO»?', 'Механика готова: ступень ставится сама, когда выполнены условия. Нет только чисел: в ваших документах написано «критерии не дополняются», и я их не придумывал. «Проверен» уже работает: паспорт, статус и пять заказов без жалоб.',
    [['Стабильный — 10 заказов, оценка от 4,5, споров не больше 10 %, 3 месяца на ZELDO. Надёжный — 50 заказов, от 4,7, до 5 %, полгода. Выбор ZELDO — 150 заказов, от 4,8, до 3 %, год', 'Сначала растёт число заказов, потом оценка и стаж'], ['Мягче: 5, 20 и 50 заказов, оценка от 4,5', 'Ступени появятся у мастеров быстрее'], ['До запуска не выдавать, решим по первым мастерам', 'Все видят «Новый» или «Проверен»']], 1,
    'Числа меняются в админке за минуту. С ними исполнитель видит путь: что сделать, чтобы подняться. Без чисел лестница пустая.'],
  ['Награды', 'Значки исполнителя: за что давать?', 'Четыре значка из ваших документов: «Точно в срок», «Возвращаются снова», «Высокая оценка», «Без нарушений». Внешний вид утверждён, условий нет.',
    [['«Точно в срок» — 90 % заказов начаты вовремя, от 10 заказов. «Возвращаются снова» — 30 % клиентов заказали повторно, от 10 клиентов. «Высокая оценка» — от 4,8 при 10 отзывах. «Без нарушений» — 90 дней без отмен по своей вине и проигранных споров, от 5 заказов', ''], ['Строже: 95 %, 40 %, 4,9 и 180 дней', 'Значки будут редкими и весомыми'], ['Не к запуску', 'Значков пока нет ни у кого']], 1,
    'Каждый значок считается по настоящим заказам: время начала, повторные клиенты, отзывы, споры. Заказчик видит их в профиле исполнителя.'],
  ['Награды', 'Заказчик: когда он «Проверен» и «Надёжный»?', 'Считаем принятые заказы и отмены после оплаты по инициативе заказчика. Исполнитель видит ступень, когда заказчик к нему обращается.',
    [['Проверен — 1 принятый заказ без отмен. Надёжный — 5 заказов и не больше 1 отмены', ''], ['Проверен — 3 заказа, Надёжный — 10', 'Строже'], ['До запуска только «Новый»', '']], 1,
    'Первый принятый заказ уже показывает, что человек платит и принимает работу. Мастеру этого достаточно, чтобы спокойнее браться за заказ.'],
  ['Мои связи', 'Уровни «Поток», «Орбита», «Экосистема»: сколько нужно?', '«Искра» — 1 лично приглашённый с заказом, «Импульс» — 3. Это из ваших документов, уже работает. Для следующих есть принцип: лично приглашённые сами привели человека с заказом. Чисел нет.',
    [['3, 10 и 30 таких людей', ''], ['2, 5 и 15', 'Быстрее растёт'], ['Пока только «Искра» и «Импульс»', 'Остальные — после запуска']], 1,
    'Каждый следующий уровень втрое труднее предыдущего: так «Экосистема» остаётся редкой, а «Поток» достижим за первые месяцы.'],
  ['Мои связи', 'Пакеты на 30 дней: включаем к запуску?', 'Пакет даётся, когда заказы человека и его приглашённых набрали порог. Исполнителю — комиссия 10 / 10 / 9,75 / 9,5 / 9 %. Порог «Искры» 10 000 ₽ утверждён, 50, 100, 200 и 400 тыс. ₽ у вас помечены «предварительно». Сейчас пакеты выключены, включаются одной галочкой.',
    [['Включаем с этими порогами', ''], ['Включаем только «Искру» за 10 000 ₽', 'Остальные — после расчёта'], ['Пока выключены: сначала посчитаем на первых заказах', '']], 3,
    'Каждая льгота уменьшает комиссию ZELDO. Когда появятся первые заказы, посчитаем, сколько это стоит, и включим.'],
  ['Мои связи', 'Скидка заказчику по пакету 3–4 %: кто её оплачивает?', 'В таблице пакетов заказчику — 3 % на 1–3 заказа и 4 % на 5. В документах не сказано, из чьих денег. Пока скидка не подключена.',
    [['ZELDO из своей комиссии', 'Исполнитель получает как обычно'], ['Исполнитель', 'Его выплата меньше на 3–4 %'], ['Убираем скидку заказчику, оставляем только льготу исполнителю', '']], 1,
    'Исполнитель не выбирал этот пакет и не должен за него платить. Если скидку оплачивает ZELDO, пакет мотивирует приглашать людей, а мастер ничего не теряет.'],
  ['Мои связи', 'Минимум вывода баллов в рубли', 'Выводят только ИП и ООО, комиссия 5 %. Сейчас минимум 1 000 баллов, админ меняет его в один клик.',
    [['1 000 баллов', 'Как сейчас'], ['5 000 баллов', 'Как в августовских макетах'], ['Без минимума', '']], 1,
    'С маленькой суммы банк берёт за перевод столько же. 1 000 баллов — разумная середина, остальное партнёр тратит на заказы.'],
  ['Мои связи', 'Как партнёр подтверждает личность, пока нет банка?', 'Чтобы тратить и выводить баллы, партнёр подтверждает личность. В документах — через банк: Сбер ID, Т-ID, Альфа ID, Госуслуги. Это появится только с договором банка.',
    [['Пока по фото паспорта: смотрит сотрудник', 'Как сейчас. После проверки фото удаляем'], ['Пока не проверяем, баллы тратят сразу', 'Проще, но открыто для накруток'], ['Ждём банк: до него «Мои связи» не включаются', '']], 1,
    'Так уже работает. Один человек — один партнёр, накрутки отсекаются, и никто не ждёт банк.'],
  ['Сроки', 'Долгие работы: сколько времени у заказчика, чтобы принять работу?', 'Ремонт, пошив штор, уборка без хозяев. Сейчас офлайн-работу принимают за час, а заказчик может не успеть даже приехать. Вопрос из вопросника № 2, ответа пока нет.',
    [['Срок зависит от услуги', 'Стрижка, маникюр — 1 час. Работа без заказчика — 3 дня, исполнитель прикладывает фото. Большой ремонт — по этапам'], ['Всем офлайн-работам — 24 часа', 'Проще, но мастер маникюра ждёт деньги сутки'], ['Всем — 3 дня', 'Заказчику спокойно, мастерам долго']], 1,
    'Быстрые услуги закрываются за час, как вы решили. Долгим работам нужен свой срок. Этапы защищают обе стороны в большом ремонте: заказчик платит за то, что видел, а мастер не ждёт денег месяц.'],
  ['Запуск', 'Облако для сервера: какое и на кого заводим аккаунт?', 'Сейчас сервер работает на компьютере Матвея: ссылка временная и меняется при каждом запуске, без его Mac приложение не открыть.',
    [['Яндекс Облако на ООО', 'Договор и счета на компанию, данные в России'], ['Яндекс Облако на Матвея', 'Быстрее завести, потом переоформлять'], ['Другое облако', 'Напишите какое в комментарии']], 1,
    'Данные россиян по закону храним в России, а оператор данных у нас ООО. Значит, и облако сразу на ООО, чтобы потом не переоформлять. С облаком появится и постоянная ссылка.'],
  ['Деньги', 'Комиссия ступенями: что между 10 % и 5 %?', 'Решено: 10 % обычная ставка, 7 % с постоянных клиентов мастера, 5 % с заказа дороже 500 000 ₽. Не решено, что посередине и как считать ступень.',
    [['10 % до 100 000 ₽, 7 % до 500 000 ₽, 5 % дороже', 'Считаем по одному заказу, ставка видна сразу под ценой'], ['Ступень по обороту мастера за месяц', 'Выгодно активным, но ставка меняется посреди месяца'], ['Только 10 % и 5 %, без середины', 'Проще всего']], 1,
    'Ставку по одному заказу мастер видит сразу в строке «Вы получите» и не гадает, во что выйдет месяц.'],
  ['Деньги', 'Выплата сразу: оставляем минимум 200 ₽?', 'Сейчас: сразу — за 3 %, но не меньше 200 ₽. Тогда мастер с выплатой 1 000 ₽ отдаёт 200 ₽, то есть 20 %.',
    [['3 % без минимума', 'С 1 000 ₽ — 30 ₽'], ['3 %, но не меньше 50 ₽', 'С 1 000 ₽ — 50 ₽'], ['3 %, но не меньше 200 ₽', 'Как сейчас']], 2,
    'Минимум нужен: банк берёт за перевод и с маленькой суммы. Но 200 ₽ отпугнут мастеров с недорогими заказами, а 50 ₽ с тысячи выглядят честно.'],
  ['Деньги', 'Баллы в способах оплаты — это партнёрские баллы?', 'В вопроснике про оплату вы добавили «плюс баллы». Теперь партнёрские баллы работают: ими платят от 10 до 90 % любого заказа.',
    [['Да, это они', ''], ['Нужен ещё кешбэк за собственные заказы', 'Отдельные баллы за то, что человек сам заказывает'], ['Другое', 'Напишите в комментарии']], 1,
    'Если имелись в виду партнёрские баллы, вопрос закрыт: они уже в приложении.'],
  ['Отмены', 'Отмена после первого часа: как быть с законом?', 'Сейчас заказчик бесплатно отменяет в первый час после оплаты, позже — по договорённости или через спор. Но по закону о защите прав потребителей (ст. 32) заказчик может отказаться в любой момент, оплатив исполнителю фактические расходы.',
    [['Отменить можно всегда, исполнитель получает компенсацию', 'Больше суток до визита — полный возврат. Меньше — исполнителю плата за выезд или 30 %'], ['Оставляем как есть, показываем юристу', ''], ['Обсудим на встрече', '']], 1,
    'Так правило не спорит с законом, и мастер не остаётся ни с чем. Юристу всё равно покажем перед запуском.'],
  ['Деньги', 'Возврат при отмене: на баланс ZELDO или на карту?', 'На встрече 12.11 решили: возврат приходит на баланс, вывести на карту можно с комиссией 2 %. Но деньги за неоказанную услугу заказчик по закону вправе получить обратно полностью.',
    [['На баланс, а вывести возврат на карту можно бесплатно', '2 % — только за вывод пополнений'], ['Сразу на карту', 'Баланс — только для пополнений'], ['На баланс, вывод с 2 %', 'Как сейчас']], 1,
    'Многие оставят деньги на балансе и закажут снова. Кто хочет вернуть их на карту, получит всё без удержаний, и с законом мы не спорим.'],
  ['Название', 'ZELFIR: когда переименовываем?', 'Название решили сменить. Переименовать приложение, сайт и тексты — примерно день работы.',
    [['Сейчас, до прогона вдвоём', 'На прогоне уже видим новое имя'], ['Перед запуском', 'Пока работаем под ZELDO'], ['ZELFIR не окончательно — пришлю ТЗ на новое имя', '']], 1,
    'Чем больше людей увидят ZELDO, тем дороже смена: ссылки, скриншоты, привычка. Пока приложение видим только мы двое, переименование ничего не ломает.'],
  ['Название', 'Логотип: какой нужен сейчас?', 'В приложении сейчас вместо знака — само название.',
    [['Пока просто название', 'Знак закажем перед запуском'], ['Матвей делает 3 варианта знака на выбор', 'За пару дней'], ['Сразу заказываем знак у дизайнера', 'Несколько недель и бюджет']], 1,
    'Для прогона и первых мастеров хватит названия. Знак лучше заказывать, когда станет ясен стиль рекламы и соцсетей.'],

    [['Паспорт вручную, статус в ФНС — автоматически', 'Как сейчас'], ['Всё вручную', ''], ['Сразу подключаем платный сервис', 'Быстрее для мастера, но договор и оплата за каждую проверку']], 1,

  ['Админка', 'Кто ещё будет в админке?', 'Роли: админ, модератор, поддержка, аналитик. Сейчас админы — вы и Матвей.',
    [['Пока только мы двое', ''], ['Добавим модератора или поддержку', 'Напишите почты и роли в комментарии']], 1,
    'Пока заказов мало, вдвоём справимся. Сотрудника админ добавляет в разделе «Сотрудники» за минуту.'],
  ['Админка', 'Карточки исполнителей: проверять до публикации?', 'Сейчас работает автопроверка без ИИ: чистая карточка публикуется сама, сомнительная уходит модератору (мат, запрещённые услуги, чужие фото, капслок). Карточки с лицензией — всегда модератору.',
    [['Как сейчас', 'Автопроверка, сомнительные — модератору'], ['Каждую карточку — модератору', 'Надёжнее, но мастер ждёт'], ['Все сразу, снимаем по жалобам', '']], 1,
    'Мастер публикуется за минуту, а всё подозрительное всё равно видит человек.'],
  ['Админка', 'Кто отвечает в поддержке с 9 до 21?', 'Обращения приходят в админку, раздел «Поддержка». Человек видит, что ответим с 9 до 21 по Москве.',
    [['Максим', ''], ['Матвей', ''], ['По очереди, пока заказов мало', '']], 3,

  ['Споры', 'Споры: оставляем ИИ?', 'Сейчас: второй стороне 12 часов на ответ, потом ИИ предлагает решение для споров до 15 000 ₽, сутки на согласие. Не согласны или случай сложный (ущерб, угрозы) — администратор. ИИ видит только «Заказчик» и «Исполнитель», без имён и почт. Чтобы ИИ заработал, Матвею нужно пройти проверку организации в Anthropic; до неё споры решает администратор.',
    [['Оставляем так', ''], ['ИИ только советует, решает всегда человек', 'Медленнее'], ['Без ИИ, только администратор', '']], 1,
    'Большинство споров мелкие и похожи друг на друга. ИИ разбирает их за минуты, а всё сложное и спорное всё равно решает человек.'],
  ['Споры', 'Переписка по спору уходит в Claude — зарубежный сервис. Как быть?', 'Сервер будет в России, а Claude работает за границей. По закону о персональных данных это нужно записать в политику и предупредить людей.',
    [['Пишем в политику, предупреждаем при открытии спора', ''], ['За границу не отправляем: споры решают только люди', ''], ['Ищем российский ИИ', 'Отдельная работа']], 1,
    'Имена и почты ИИ и так не получает, только суть спора. С записью в политике всё по закону.'],
];
const KEY = 'zeldo-voprosy-3';
let st; try { st = JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { st = null; }
if (!st) st = { i: -1, a: {} };
const savedText = () => '';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* без памяти — ответы держатся до закрытия */ } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const $ = id => document.getElementById(id);
function head() { const n = Q.length; const i = Math.max(0, Math.min(st.i, n));
  $('pg').style.width = `${st.i < 0 ? 0 : Math.round(i / n * 100)}%`; $('cnt').textContent = st.i < 0 ? '' : st.i >= n ? 'готово' : `${st.i + 1} из ${n}`; }
function answerText(k) { const q = Q[k], a = st.a[k] || {}; const pick = a.o ? `${a.o}. ${q[3][a.o - 1][0]}` : 'свой вариант'; return `${pick}${a.c ? ` — ${a.c}` : ''}`; }
function show() {
  head(); window.scrollTo(0, 0);
  if (st.i < 0) {
    const g = {}; Q.forEach(q => { g[q[0]] = (g[q[0]] || 0) + 1; });
    $('app').innerHTML = `<section class="hello"><div class="blk">Вопросник № 3 · к встрече</div><h1>${Q.length} вопроса, на которые нужны ваши ответы</h1>
      <p>Партнёрка и награды готовы, не хватает только ваших чисел и решений. Сюда же вошли вопросы из вопросника № 2, на которые ответа пока нет, и вопросы по админке и спорам.</p>
      <div class="groups">${Object.entries(g).map(([k, n]) => `<div><span>${esc(k)}</span><b>${n}</b></div>`).join('')}</div>
      <ol><li>По одному вопросу на экране: варианты ответа и рекомендация Матвея с объяснением.</li><li>Выберите вариант или напишите свой. Комментарий — по желанию.</li><li>В конце нажмите «Отправить» и выберите Телеграм: чат с Матвеем.</li></ol>
      <p class="ctx">Можно прерваться: ответы запоминаются. Займёт около ${Math.ceil(Q.length / 3)} минут.</p></section>`;
    $('bar').innerHTML = `<button class="btn" id="go">${Object.keys(st.a).length ? 'Продолжить' : 'Начать'}</button>`;
    $('go').onclick = () => { st.i = Object.keys(st.a).length ? Math.min(Q.length, Object.keys(st.a).length) : 0; save(); show(); };
    return;
  }
  if (st.i >= Q.length) return end();
  const k = st.i, q = Q[k], a = st.a[k] || {};
  $('app').innerHTML = `<div class="blk">${esc(q[0])}</div><h1>${esc(q[1])}</h1><p class="ctx">${esc(q[2])}</p>
    <div class="rec"><b>Рекомендую ${q[4]}.</b> ${esc(q[5])}</div>
    <div class="opts" role="radiogroup" aria-label="Варианты ответа">${q[3].map((o, j) => `<button class="opt ${a.o === j + 1 ? 'on' : ''}" role="radio" aria-checked="${a.o === j + 1}" data-o="${j + 1}"><span class="n">${j + 1}</span><span class="t"><span>${esc(o[0])}${j + 1 === q[4] ? '<span class="badge">рекомендую</span>' : ''}</span>${o[1] ? `<span class="s">${esc(o[1])}</span>` : ''}</span></button>`).join('')}</div>
    <label class="cm" for="cm">Свой вариант или комментарий</label><textarea id="cm" placeholder="Например: да, но с оговоркой…">${esc(a.c || '')}</textarea>
    <div class="saved" id="saved">${savedText()}</div>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => { st.a[k] = Object.assign({}, st.a[k], { o: +b.dataset.o }); save(); show(); });
  $('cm').oninput = e => { st.a[k] = Object.assign({}, st.a[k], { c: e.target.value.trim() }); if (!st.a[k].o && !st.a[k].c) delete st.a[k]; save(); $('nx').disabled = !st.a[k]; };
  $('bar').innerHTML = `<button class="btn soft" id="bk">Назад</button><button class="btn" id="nx" ${st.a[k] ? '' : 'disabled'}>${k === Q.length - 1 ? 'Готово' : 'Дальше'}</button>`;
  $('bk').onclick = () => { st.i--; save(); show(); };
  $('nx').onclick = () => { st.i++; save(); show(); };
}
/* сообщение в Телеграме — до 4096 знаков: вопрос сокращаем; не влезло — только номера ответов и комментарии (полный текст Матвей восстановит по номерам) */
function report(full) {
  const h = `Ответы Максима, вопросник № 3 по ZELDO (${new Date().toLocaleDateString('ru-RU')})\n\n`;
  const cut = s => s.length > 48 ? s.slice(0, 46).replace(/\s+\S*$/, '') + '…' : s;
  const a = h + Q.map((q, k) => `${k + 1}. ${full ? q[1] : cut(q[1])}\n→ ${st.a[k] ? answerText(k) : 'без ответа'}`).join(full ? '\n\n' : '\n');
  if (full || a.length <= 3900) return a;
  return h + Q.map((q, k) => { const x = st.a[k] || {}; return `${k + 1} → ${x.o || '—'}${x.c ? ` («${x.c}»)` : ''}`; }).join('\n');
}
function end() {
  const missed = Q.filter((q, k) => !st.a[k]).length;
  $('app').innerHTML = `<section class="end"><div class="blk">Готово</div><h1>Спасибо! Осталось отправить ответы Матвею</h1>
    <p>Нажмите «Отправить» внизу и выберите Телеграм: чат с Матвеем. Или «Скопировать» и вставьте в чат сами.</p>
    <p>${missed ? `Без ответа: ${missed}. Можно вернуться к ним или отправить так.` : 'Ответы есть на все вопросы.'} По ним Матвей впишет числа в админку и соберёт итоговый документ.</p>
    <div class="sum">${Q.map((q, k) => `<div><b>${k + 1}. ${esc(q[1])}</b><span class="${st.a[k] ? '' : 'm'}">${st.a[k] ? esc(answerText(k)) : 'без ответа'}</span><br><button data-k="${k}">Изменить</button></div>`).join('')}</div>
    <p class="ctx" id="msg"></p><div class="saved" id="saved">${savedText()}</div></section>`;
  document.querySelectorAll('.sum button').forEach(b => b.onclick = () => { st.i = +b.dataset.k; save(); show(); });
  $('bar').innerHTML = `<button class="btn soft" id="cp">Скопировать</button><button class="btn" id="tg">Отправить</button>`;
  $('tg').onclick = async () => {
    if (navigator.share) {
      try { await navigator.share({ text: report() }); $('msg').innerHTML = '<span class="ok">Готово.</span> Если выбрали Матвея и нажали «Отправить», ответы у него.'; return; }
      catch (e) { if (e && e.name === 'AbortError') { $('msg').textContent = 'Отправка отменена. Нажмите ещё раз и выберите Телеграм → чат с Матвеем.'; return; } }
    }
    const t = report(); const a = document.createElement('a'); a.href = `https://t.me/share/url?url=${encodeURIComponent(location.origin + location.pathname)}&text=${encodeURIComponent('\n' + t)}`; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
    $('msg').textContent = 'Выберите в Телеграме чат с Матвеем и отправьте. Если Телеграм не открылся, нажмите «Скопировать».'; };
  $('cp').onclick = async () => { try { await navigator.clipboard.writeText(report(true)); $('msg').innerHTML = '<span class="ok">Скопировано.</span> Вставьте в чат с Матвеем.'; }
    catch (e) { $('msg').innerHTML = 'Не получилось скопировать автоматически. Выделите текст ниже и скопируйте.'; const pre = document.createElement('textarea'); pre.value = report(true); pre.rows = 10; $('msg').after(pre); pre.select(); } };
}
show();
</script>
